<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Community API Tester</title>
  <script 
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1/dist/umd/supabase.js" 
    integrity="sha384-SFDMqH+LQQ/LYtTNdFzLtsy2g0JpTn32wTG8s8wm9YUTyDstYKO9bcC6UDMGwNNl" 
    crossorigin="anonymous">
  </script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; max-width: 800px; margin: auto; }
    input, textarea, button { margin: 5px 0; width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; }
    button { background-color: #1b8a5a; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #34b27b; }
    section { border: 1px solid #eee; padding: 20px; margin-bottom: 20px; border-radius: 12px; background: #fafafa; }
    pre { background: #1e1e1e; color: #d4d4d4; padding: 15px; overflow-x: auto; border-radius: 8px; font-size: 13px; max-height: 400px; }
    .status-group { display: flex; gap: 20px; font-size: 0.9em; color: #666; }
    .typing-text { color: #3ecf8e; font-style: italic; }
    .like-btn { width: auto; padding: 2px 8px; font-size: 12px; background: #444; margin-left: 10px; }
    .like-btn.active { background: #e0245e; }
  </style>
</head>
<body>
  <h1>Community API Tester</h1>

  <section>
    <h3>1. Config</h3>
    <input id="userName" placeholder="Your Name (e.g. Alex)" value="User_1"/>
    <input id="token" placeholder="Access Token" value=""/>
    <input id="supabaseUrl" placeholder="Supabase URL" value="https://sxjbsufglwxkpkhshvyi.supabase.co"/>
    <input id="supabaseKey" placeholder="Supabase Anon Key" value="sb_publishable_dRXmXXP7AsaQn7V5vviYmQ_4f9fEyQx"/>
  </section>

  <section>
    <h3>2. Study Room</h3>
    <input id="roomId" placeholder="Room ID (UUID)" />
    <div style="display: flex; gap: 10px;">
        <button onclick="joinRoom()">Join Room</button>
        <button onclick="leaveRoom()" style="background: #ff4d4d;">Leave Room</button>
    </div>
    <div class="status-group">
        <p><b>Participants:</b> <span id="presence">0</span></p>
        <p><b>Status:</b> <span id="typing" class="typing-text">-</span></p>
    </div>
  </section>

  <section>
    <h3>3. Chat</h3>
    <textarea id="chatMessage" placeholder="Type a message..." oninput="sendTypingBroadcast()"></textarea>
    <button onclick="sendMessage()">Send Message</button>
  </section>

  <h3>Message Feed</h3>
  <pre id="messages">[]</pre>

  <script>
    const BASE = "https://mahasiswa-sukses-backend.vercel.app/api/v1/community";
    let supabaseClient = null;
    let channel = null;
    let typingTimeout = null;
    // Map to track like counts locally: { messageId: count }
    let messageLikes = new Map();

    function headers() {
      return {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + document.getElementById("token").value
      };
    }

    let typingUsers = new Map()
    async function joinRoom() {
      const roomId = document.getElementById("roomId").value;
      const name = document.getElementById("userName").value;
      
      if(!roomId) return alert("Please enter a Room ID");

      // 1. Notify Backend
      await fetch(`${BASE}/rooms/${roomId}/join`, {
        method: "POST",
        headers: headers()
      });

      const url = document.getElementById("supabaseUrl").value;
      const key = document.getElementById("supabaseKey").value;

      // 2. Init Supabase
      supabaseClient = globalThis.supabase.createClient(url, key, {
        global: { headers: { Authorization: "Bearer " + document.getElementById("token").value } }
      });

      channel = supabaseClient.channel(`study_room:${roomId}`, {
        config: { 
          presence: { key: name }, 
        }
      });

      // Listen for Database Changes (Messages)
      channel.on('postgres_changes', {
          event: 'INSERT',
          schema: 'public',
          table: 'study_room_messages',
          filter: `room_id=eq.${roomId}`
        },
        payload => {
          appendMessage(payload.new)
        }
      );

      // listen for like toggle changes
      channel.on('postgres_changes', {
          event: '*', 
          schema: 'public',
          table: 'room_chat_likes',
          filter: `room_id=eq.${roomId}`
        },
        payload => {
          handleLikeChange(payload);
        }
      );

      // Listen for Presence (Who is online)
      channel.on('presence', { event: 'sync' }, () => {
        const state = channel.presenceState();
        document.getElementById("presence").innerText = Object.keys(state).length;
      });

      // Listen for Typing Broadcasts
      
      channel.on('broadcast', { event: 'typing' }, payload => {
        const { name } = payload.payload;

        // mark user as typing
        typingUsers.set(name, Date.now());

        updateTypingUI();

        // set individual timeout per user
        setTimeout(() => {
          const last = typingUsers.get(name);

          // only remove if no newer typing event
          if (Date.now() - last >= 2000) {
            typingUsers.delete(name);
            updateTypingUI();
          }
        }, 2000);
      });

      await channel.subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
          // Track presence with user name
          await channel.track({ name: name, online_at: new Date().toISOString() });
        }
      });

      loadHistory(roomId);
    }

    function updateTypingUI() {
      const typingEl = document.getElementById("typing");

      const names = Array.from(typingUsers.keys());

      if (names.length === 0) {
        typingEl.innerText = "-";
      } else if (names.length === 1) {
        typingEl.innerText = `${names[0]} is typing...`;
      } else {
        typingEl.innerText = `${names.join(", ")} are typing...`;
      }
    }

    // Call this on textarea input
    let lastSent = 0;
    function sendTypingBroadcast() {
      const now = Date.now();
      if (channel && now - lastSent > 500) {
          channel.send({
              type: 'broadcast',
              event: 'typing',
              // or user id with new endpoint to fetch username based on id
              payload: { name: document.getElementById("userName").value }
          });
          lastSent = now;
      }
    }

    async function sendMessage() {
      const roomId = document.getElementById("roomId").value;
      const content = document.getElementById("chatMessage").value;
      if(!content) return;

      await fetch(`${BASE}/rooms/${roomId}/messages`, {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({ content })
      });

      document.getElementById("chatMessage").value = "";
    }

    async function toggleLike(messageId) {
      try {
        await fetch(`${BASE}/room/message/${messageId}/like`, {
          method: "POST",
          headers: headers()
        });
      } catch (e) {
        console.error("Failed to toggle like", e);
      }
    }

    function handleLikeChange(payload) {
      const chatId = payload.new.chat_id ?? payload.old.chat_id;
      if (!chatId) return;

      const messageRows = document.querySelectorAll("#messages div");
      
      let targetBtn = null;
      messageRows.forEach(row => {
        if (row.innerText.includes(`[${chatId}]`)) {
          targetBtn = row.querySelector(".like-btn");
        }
      });

      if (targetBtn) {
        let currentCount = Number.parseInt(targetBtn.innerText.replace('❤ ', '')) || 0;
        
        if (payload.eventType === 'INSERT') {
          currentCount++;
          targetBtn.classList.add('active'); 
        } else if (payload.eventType === 'DELETE') {
          currentCount = Math.max(0, currentCount - 1);
          targetBtn.classList.remove('active');
        }

        targetBtn.innerText = `❤ ${currentCount}`;
      } else {
        loadHistory(document.getElementById("roomId").value);
      }
    }

    async function loadHistory(roomId) {
      try {
        const res = await fetch(`${BASE}/rooms/${roomId}/messages`, { headers: headers() });
        const data = await res.json();
        renderMessages(data);
      } catch (e) {
        console.error("Failed to load history", e);
      }
    }

    function renderMessages(data) {
        const el = document.getElementById("messages");
        el.innerHTML = "";
        const list = Array.isArray(data) ? data : [];
        
        list.forEach(msg => {
            const container = document.createElement("div");
            container.style.borderBottom = "1px solid #333";
            container.style.padding = "5px 0";
            
            const text = document.createElement("span");
            text.innerText = `[${msg.id}] ${msg.author.id}...: ${msg.content}`;
            
            const likeBtn = document.createElement("button");
            likeBtn.className = "like-btn";
            likeBtn.innerText = `❤ ${msg.likes_count || 0}`;
            likeBtn.onclick = () => toggleLike(msg.id);
            
            container.appendChild(text);
            container.appendChild(likeBtn);
            el.appendChild(container);
        });

        if(list.length === 0) el.innerText = "[]";
    }

    function appendMessage(msg) {
      const el = document.getElementById("messages");
      
      if (el.innerText === "[]") {
        el.innerHTML = "";
      }

      const container = document.createElement("div");
      container.dataset.msgId = msg.id;
      container.style.borderBottom = "1px solid #333";
      container.style.padding = "5px 0";

      const text = document.createElement("span");
      const userId = msg.author_id;
      text.innerText = `[${msg.id}] ${userId}...: ${msg.content}`;

      const likeBtn = document.createElement("button");
      likeBtn.className = "like-btn";
      likeBtn.innerText = `❤ 0`; // new messages start with 0 likes
      likeBtn.onclick = () => toggleLike(msg.id);

      container.appendChild(text);
      container.appendChild(likeBtn);
      
      el.prepend(container);
    }

    async function leaveRoom() {
      const roomId = document.getElementById("roomId").value;
      await fetch(`${BASE}/rooms/${roomId}/leave`, { method: "DELETE", headers: headers() });
      if (channel) {
        supabaseClient.removeChannel(channel);
        channel = null;
        document.getElementById("presence").innerText = "0";
        document.getElementById("typing").innerText = "-";
        document.getElementById("messages").innerText = "[]";
      }
    }
  </script>
</body>
</html>
