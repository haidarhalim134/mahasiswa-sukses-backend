<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password</title>

<style>
/* 1. Global Reset to fix the alignment issue */
*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f6f8;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    background: white;
    padding: 40px 30px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    width: 380px;
}

h2 {
    margin-bottom: 24px;
    text-align: center;
    color: #1e293b;
    font-size: 24px;
}

/* Form Group for cleaner spacing control */
.form-group {
    margin-bottom: 16px;
}

input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    font-size: 14px;
    transition: all 0.2s ease;
    outline: none;
}

input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}

button {
    margin-top: 8px;
    width: 100%;
    padding: 12px;
    background: #2563eb;
    border: none;
    color: white;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease;
}

button:hover {
    background: #1d4ed8;
}

button:disabled {
    background: #cbd5e1;
    color: #64748b;
    cursor: not-allowed;
}

.message {
    font-size: 13px;
    margin-top: 6px;
    font-weight: 500;
    display: none; 
}

.error {
    color: #dc2626;
    display: block;
}

.success {
    color: #16a34a;
    display: block;
}
</style>
</head>

<body>

<div class="container">
    <h2>Reset Password</h2>

    <div class="form-group">
        <input
            type="password"
            id="password"
            placeholder="New password"
            oninput="validatePassword()"
        />
        <div id="lengthMsg" class="message"></div>
    </div>

    <div class="form-group">
        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            oninput="validatePassword()"
        />
        <div id="matchMsg" class="message"></div>
    </div>

    <button id="resetBtn" onclick="resetPassword()" disabled>
        Reset Password
    </button>
</div>

<script>
function validatePassword() {
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    const lengthMsg = document.getElementById("lengthMsg"); 
    const matchMsg = document.getElementById("matchMsg");
    const resetBtn = document.getElementById("resetBtn");

    let valid = true;

    const complexityPattern = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,}$/;

    if (password.length === 0) {
        lengthMsg.className = "message";
        lengthMsg.textContent = "";
        valid = false;
    } else if (!complexityPattern.test(password)) {
        lengthMsg.textContent = "Password must be at least 8 characters and contain at least one letter, one number, and one special character.";
        lengthMsg.className = "message error";
        valid = false;
    } else {
        lengthMsg.textContent = "Password strength OK";
        lengthMsg.className = "message success";
    }

    if (confirmPassword && password !== confirmPassword) {
        matchMsg.textContent = "Passwords do not match";
        matchMsg.className = "message error";
        valid = false;
    } else if (confirmPassword) {
        matchMsg.textContent = "Passwords match";
        matchMsg.className = "message success";
    } else {
        matchMsg.className = "message";
        matchMsg.textContent = "";
    }

    resetBtn.disabled = !valid;
}

async function resetPassword(){
    const password = document.getElementById("password").value

    const hash = window.location.hash
    const params = new URLSearchParams(hash.substring(1))
    const access_token = params.get("access_token")

    const res = await fetch("/api/v1/auth/update-password",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            access_token: access_token,
            password: password
        })
    })

    if(res.ok){
        alert("Password updated successfully!")
    }else{
        alert("Error updating password")
    }
}
</script>

</body>
</html>
